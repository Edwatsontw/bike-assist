name: Build SafeWay APK

on:
  push:
    branches: [safeway-final]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_application_1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6   # same as the handoff's local SDK
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit & widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk build/SafeWay-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SafeWay-apk
          path: flutter_application_1/build/SafeWay-${{ github.run_number }}.apk

      - name: Publish to the "safeway-latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: safeway-latest
          name: SafeWay 最新測試版
          prerelease: true
          files: flutter_application_1/build/SafeWay-${{ github.run_number }}.apk
          body: |
            由 safeway-final 分支自動打包（第 ${{ github.run_number }} 次建置，commit ${{ github.sha }}）。
            Debug 簽章：安裝前需先移除舊版 APP。
