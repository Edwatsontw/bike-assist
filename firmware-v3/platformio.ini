; 二代機：GOOUUU ESP32-S3-CAM（ESP32-S3-WROOM-1 N16R8，16MB Flash / 8MB OPI PSRAM）
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi   ; N16R8 = QIO Flash + OPI PSRAM，預設 qio_qspi 抓不到 PSRAM
board_upload.flash_size = 16MB

; 啟用 OPI PSRAM（相機 frame buffer 需要）
build_flags =
    -DBOARD_HAS_PSRAM

upload_protocol = esptool
upload_speed = 115200   ; 2026-10-02 降速：預設 921600 燒錄會中斷

lib_deps =
    electroniccats/MPU6050 @ ^1.3.0
    espressif/esp32-camera @ ^2.0.4
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson @ ^7.0.0   ; /provision JSON 解析用
    h2zero/NimBLE-Arduino @ ^1.4.0   ; 倒車示警 BLE 廣播（輕量，比內建Bluedroid省記憶體）

; ── 正式韌體（pio run -e esp32-s3-devkitc-1 -t upload）──────────────
;    main.cpp ＋ IMU/AccelAnalyzer/GPS/Camera/IndicatorModule（無後端，不含 Network）
[env:esp32-s3-devkitc-1]
build_src_filter = +<*> -<apptest.cpp> -<i2cscan.cpp> -<Network.cpp>   ; 已取消後端，不編 Network

; ── APP 整合測試（pio run -e apptest -t upload）─────────────────────
;    配網 + IMU + GPS + SD + 鏡頭串流 + 方向燈（apptest.cpp 自帶相機/SD）
[env:apptest]
build_src_filter = +<apptest.cpp> +<IMU.cpp> +<GPS.cpp>

; ── I2C 掃描小工具（pio run -e i2cscan -t upload）───────────────────
[env:i2cscan]
build_src_filter = +<i2cscan.cpp>
